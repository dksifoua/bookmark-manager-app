name: Deployment
on:
  push:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false
  
jobs:

  build:
    runs-on: ubuntu-latest
    
    environment: Deployment
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build migration image (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./migration.Dockerfile
          load: true
          tags: bookmark-manager-migration:ci
          push: false
            
      - name: Run migrations against external DB
        run: |
          docker run --rm \
            -e "ConnectionStrings__DefaultConnection=${{ secrets.DATABASE_CONNECTION_STRING }}" \
            bookmark-manager-migration:ci

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      
      - name: Build and push the Docker image for the API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bookmark-manager-api:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Deployment
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        working-directory: ./bookmark-manager-ui
        run: bun install

      - name: Build project
        working-directory: ./bookmark-manager-ui
        run: bun run build
        env:
          VITE_BOOKMARK_MANAGER_API_URL: ${{ vars.VITE_BOOKMARK_MANAGER_API_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./bookmark-manager-ui/dist
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4