name: API
on:
  push:
    branches:
      - main
        
jobs: 
  build:
    runs-on: ubuntu-latest
    environment: github-actions
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build migration image (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./migration.Dockerfile
          load: true
          tags: bookmark-manager-migration:ci
          push: false
            
      - name: Run migrations against external DB
        run: |
          docker run --rm \
            -e "ConnectionStrings__DefaultConnection=${{ secrets.DATABASE_CONNECTION_STRING }}" \
            bookmark-manager-migration:ci

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      
      - name: Build and push the Docker image for the API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bookmark-manager-api:latest
