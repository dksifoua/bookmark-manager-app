services:
  postgres:
    image: postgres:latest
    container_name: database
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: bookmark
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d bookmark" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  
  migration:
    build:
      context: .
      dockerfile: BookmarkManagerApp/DockerfileMigration
    image: bookmark-manager-database-migration
    container_name: migration
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=bookmark;Username=admin;Password=secret"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  
  api:
    build:
      context: .
      dockerfile: BookmarkManagerApp/Dockerfile
    image: bookmark-manager-api
    container_name: api
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=bookmark;Username=admin;Password=secret"
      Jwt__Key: a-string-secret-at-least-256-bits-long
      Jwt__Issuer: bookmark-manager-api
      Jwt__Audience: bookmark-manager-client
      Jwt__DurationInMinutes: 60
      AllowedCorsOrigins__0: "http://localhost:8080"
    depends_on:
      migration:
        condition: service_completed_successfully
    ports:
      - "8081:8080"
    healthcheck:
      test: [ "CMD-SHELL", "bash -lc 'echo >/dev/tcp/127.0.0.1/8080'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  
  ui:
    build:
      context: bookmark-manager-ui/
      dockerfile: Dockerfile
      args:
        VITE_BOOKMARK_MANAGER_API_URL: http://localhost:8081/api
    image: bookmark-manager-ui
    container_name: ui
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy